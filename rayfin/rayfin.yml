id: fabric-empires
name: fabric-empires
version: 0.1.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
    password:
      enabled: false
    allowedRedirectUris:
      - http://localhost:5173
      - http://localhost:4173
      - http://localhost:5180
      - http://127.0.0.1:5173
      - https://mint-flora-abb0f046f9-swedencentral.webapp.fabricapps.net
  data:
    enabled: false
  staticHosting:
    enabled: true
    folder: app/dist
    buildCommand: npm run build:public
    indexDocument: index.html
  storage:
    enabled: false
  functions:
    enabled: false
