<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fabric Empires</title>
    <!--
      A hex, inline.

      There was no icon link at all, so every browser fell back to requesting
      /favicon.ico and every session opened with a 404 in the console. A data
      URI fixes that without adding a binary asset to a repository that has
      deliberately shipped none (D59).
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 29 9.5v15L16 32 3 24.5v-15z' fill='%230e121a'/%3E%3Cpath d='M16 5.2 26.2 11v11.6L16 28.4 5.8 22.6V11z' fill='none' stroke='%234c8fd6' stroke-width='2.4'/%3E%3Ccircle cx='16' cy='16.8' r='3.4' fill='%23ffd166'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: dark;
        --panel: rgba(14, 18, 26, 0.88);
        --border: rgba(255, 255, 255, 0.12);
        --text: #e8eaf0;
        --muted: #96a0b5;
        --accent: #ffd166;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #070a10; }
      body { font: 13px/1.5 "Segoe UI", system-ui, sans-serif; color: var(--text); }
      #map { display: block; width: 100vw; height: 100vh; cursor: grab; }
      #map.dragging { cursor: grabbing; }
      /* Damage numbers and impact rings ride above the 3D view. Drawing them
         in 2D keeps text crisp at any distance, which projected 3D text is
         not, and costs one composite. */
      #fx { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 5; }

      .panel {
        position: fixed;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 14px;
        backdrop-filter: blur(8px);
      }
      h2 { margin: 0 0 4px; font-size: 13px; font-weight: 600; }
      .muted { color: var(--muted); }

      /* The capture-or-raze decision, asked at the moment the walls fall. */
      .fe-choice {
        position: fixed; inset: 0; z-index: 40;
        display: flex; align-items: center; justify-content: center;
        background: rgba(6, 9, 12, 0.72); backdrop-filter: blur(3px);
      }
      .fe-choice-card {
        width: min(520px, 92vw);
        background: var(--panel); border: 1px solid var(--border);
        border-radius: 12px; padding: 18px 20px;
      }
      .fe-choice-card h2 { font-size: 16px; margin-bottom: 8px; }
      .fe-choice-body { margin: 0 0 14px; color: var(--muted); font-size: 12px; line-height: 1.5; }
      .fe-choice-options { display: flex; flex-direction: column; gap: 8px; }
      .fe-choice-option {
        display: flex; flex-direction: column; gap: 3px;
        text-align: left; padding: 10px 12px; cursor: pointer;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--border); border-radius: 8px;
        color: inherit; font: inherit;
      }
      .fe-choice-option:hover { background: rgba(255, 255, 255, 0.09); }
      .fe-choice-option.primary { border-color: var(--accent); }
      .fe-choice-label { font-weight: 600; font-size: 13px; }
      .fe-choice-detail { color: var(--muted); font-size: 11px; line-height: 1.45; }

      /* The setup screen, shown before the world is built. */
      .fe-setup {
        position: fixed; inset: 0; z-index: 60;
        display: flex; align-items: center; justify-content: center;
        background: radial-gradient(ellipse at 50% 30%, #14202a 0%, #070a0d 70%);
        overflow: auto; padding: 24px 0;
      }
      .fe-setup-card {
        width: min(760px, 92vw);
        background: var(--panel); border: 1px solid var(--border);
        border-radius: 14px; padding: 26px 30px;
      }
      .fe-setup-card h1 {
        margin: 0 0 6px; font-size: 26px; font-weight: 600;
        letter-spacing: 0.01em; color: var(--accent);
      }
      .fe-setup-blurb {
        margin: 0 0 20px; color: var(--muted);
        font-size: 12px; line-height: 1.6; max-width: 56ch;
      }
      .fe-setup-group { margin-bottom: 18px; }
      .fe-setup-section {
        margin: 22px 0 10px; font-size: 13px; font-weight: 600;
        color: var(--text); padding-bottom: 6px;
        border-bottom: 1px solid var(--border);
      }
      .fe-setup-section:first-of-type { margin-top: 4px; }
      .fe-setup-group h3 {
        margin: 0 0 8px; font-size: 11px; font-weight: 600;
        text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted);
      }
      .fe-setup-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .fe-setup-option {
        display: flex; flex-direction: column; gap: 4px; text-align: left;
        padding: 11px 13px; cursor: pointer; color: inherit; font: inherit;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--border); border-radius: 9px;
      }
      .fe-setup-option:hover { background: rgba(255, 255, 255, 0.08); }
      .fe-setup-option.active {
        border-color: var(--accent);
        background: rgba(74, 159, 224, 0.14);
      }
      .fe-setup-label { font-weight: 600; font-size: 13px; }
      .fe-setup-detail { color: var(--muted); font-size: 11px; line-height: 1.45; }
      .fe-setup-seed { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
      .fe-setup-seed input {
        background: rgba(0, 0, 0, 0.35); color: inherit; font: inherit;
        border: 1px solid var(--border); border-radius: 7px;
        padding: 8px 10px; width: 190px;
      }
      .fe-setup-play {
        margin-top: 6px; width: 100%; padding: 12px;
        font: inherit; font-weight: 600; font-size: 14px; cursor: pointer;
        color: #06222f; background: var(--accent);
        border: none; border-radius: 9px;
      }
      .fe-setup-play:hover { filter: brightness(1.1); }
      @media (max-width: 640px) {
        .fe-setup-options { grid-template-columns: 1fr; }
      }

      #resources { top: 14px; left: 14px; display: flex; gap: 18px; align-items: center; }
      #resources .res { display: flex; gap: 6px; align-items: baseline; }
      #resources .res b { font-size: 15px; font-weight: 600; }
      #resources .res span {
        color: var(--muted); font-size: 11px;
        text-transform: uppercase; letter-spacing: 0.06em;
      }
      #turn-badge { font-weight: 600; color: var(--accent); }

      #selection { bottom: 14px; left: 14px; width: 290px; }
      #selection .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
      button {
        background: #1d2636; border: 1px solid var(--border); color: var(--text);
        border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer;
      }
      button:hover:not(:disabled) { background: #2a3750; }
      button:disabled { opacity: 0.4; cursor: not-allowed; }
      button.primary { background: #2f5d8c; border-color: #3f7cb8; }
      button.primary:hover:not(:disabled) { background: #3a72a8; }

      #controls { top: 14px; right: 14px; display: flex; gap: 8px; align-items: center; }
      #controls input {
        background: #0b0e14; border: 1px solid var(--border); color: var(--text);
        border-radius: 6px; padding: 6px 8px; width: 110px; font: inherit;
        text-transform: uppercase;
      }

      #log { bottom: 14px; right: 14px; width: 330px; max-height: 42vh; overflow-y: auto; }
      #log .entry { padding: 3px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
      #log .entry:last-child { border-bottom: none; }
      #log .entry.bad { color: #ff9b91; }
      #log .entry.good { color: #8fd694; }

      #research { top: 62px; left: 14px; width: 320px; }
      #research .bar {
        height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.1);
        margin: 6px 0 8px; overflow: hidden;
      }
      #research .bar > div { height: 100%; background: #4c8fd6; width: 0%; }
      #research .options { display: flex; flex-direction: column; gap: 4px; max-height: 30vh; overflow-y: auto; }
      #research .options button {
        text-align: left; font-size: 12px; line-height: 1.35; padding: 5px 8px;
      }
      #research .cluster { color: var(--muted); font-size: 11px; }

      #tile { bottom: 14px; left: 50%; transform: translateX(-50%); text-align: center; min-width: 240px; }
      #help { top: 62px; right: 14px; color: var(--muted); text-align: right; font-size: 12px; }

      #threats { top: 124px; right: 14px; width: 272px; max-height: 42vh; overflow-y: auto; }
      #threats h2 { margin: 0 0 4px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
      #threats .foe {
        display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; gap: 8px;
        align-items: start; padding: 5px 0;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
      }
      #threats .foe:first-of-type { border-top: none; }
      #threats .swatch { width: 8px; height: 8px; border-radius: 2px; margin-top: 4px; }
      #threats .foe b { font-size: 12px; font-weight: 600; }
      #threats .cluster { display: block; color: var(--muted); font-size: 11px; line-height: 1.25; overflow-wrap: anywhere; }
      #threats .range { text-align: right; font-size: 11px; font-variant-numeric: tabular-nums; color: var(--muted); }
      #threats .ready { display: block; font-size: 11px; font-variant-numeric: tabular-nums; }
      #threats .foe.closing .range { color: #ffb64d; }
      #threats .foe.closing b { color: #ffd7a1; }
      #threats .foe.gone { opacity: 0.45; }
      #threats .foe.gone .range { color: #8fd694; }
      #threats .ready.weak { color: #ff9b91; }
      #threats .ready.solid { color: #8fd694; }

      /*
        Under the research panel, because the two are the same decision seen
        twice: both spend Compute, and a player choosing what to build should
        be able to see what that costs them in study without moving their eyes.
      */
      #cities { top: 62px; left: 348px; width: 300px; max-height: 60vh; overflow-y: auto; }
      #cities .city { padding: 7px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.07); }
      #cities .city:last-child { border-bottom: none; }
      #cities .city-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
      #cities .city-head b { font-size: 13px; }
      #cities .city-head span { color: var(--muted); font-size: 11px; }
      #cities .bar { height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.1); margin: 5px 0; overflow: hidden; }
      #cities .bar > div { height: 100%; background: #8fd694; width: 0%; }
      #cities .build { display: flex; gap: 5px; align-items: center; margin-top: 4px; }
      #cities select { flex: 1; font: inherit; font-size: 12px; padding: 3px 4px; background: #131a25; color: var(--text); border: 1px solid var(--border); border-radius: 4px; }
      #cities .status { color: var(--muted); font-size: 11px; }
      #cities .status.blocked { color: #ff9b91; }

      #readiness { color: var(--muted); font-variant-numeric: tabular-nums; }      #face-proctor {
        background: #6b4ea8; border-color: #8a6fd0; color: #f2ecff; font-weight: 600;
        animation: proctor 2.2s ease-in-out infinite;
      }
      @keyframes proctor {
        0%, 100% { box-shadow: 0 0 0 rgba(138, 111, 208, 0); }
        50% { box-shadow: 0 0 14px rgba(138, 111, 208, 0.75); }
      }
    </style>
  </head>
  <body>
    <canvas id="map"></canvas>
    <canvas id="fx"></canvas>

    <div class="panel" id="resources">
      <span id="turn-badge">Turn 1</span>
      <div class="res"><b id="res-compute">0</b><span>Compute</span></div>
      <div class="res"><b id="res-cu">0</b><span>CU</span></div>
      <div class="res"><b id="res-trust">0</b><span>Trust</span></div>
      <button id="open-library" title="The Great Library: what you actually know (l)">Library</button>
      <!--
        Exam readiness, weighted by the published branch percentages.

        In the resource bar rather than buried in the Library, because it is
        the number the Proctor watches and a threshold nobody can see is a
        threshold nobody can aim at.
      -->
      <span id="readiness" title="Share of the exam, by published weight, at familiar or better">0% exam</span>
      <button id="face-proctor" hidden title="Sit the exam: 40 questions in the published proportions">Face the Proctor</button>
      <button id="end-turn" class="primary">End turn</button>
    </div>

    <div class="panel" id="controls">
      <input id="seed-input" value="FABRIC" spellcheck="false" />
      <button id="seed-go" title="Choose a world and start again">New game</button>
    </div>

    <div class="panel" id="help">
      click a unit to select &middot; click to move or attack<br />
      drag to pan &middot; wheel to zoom &middot; space ends turn
    </div>

    <!--
      Who is coming, and what they will ask about.

      The seven antagonists each quiz one cluster of the outline, which is the
      whole design: who is marching on you tells you what you are about to be
      tested on. That was completely unreadable until this panel existed - the
      mechanic worked and nothing on screen said so.
    -->
    <div class="panel" id="threats">
      <h2>Who is coming</h2>
      <div id="threats-list"></div>
    </div>

    <div class="panel" id="tile">
      <div id="tile-name">Hover a tile</div>
      <div class="muted" id="tile-detail">&nbsp;</div>
    </div>

    <div class="panel" id="selection">
      <h2 id="sel-title">Nothing selected</h2>
      <div class="muted" id="sel-detail">Click one of your units.</div>
      <div class="actions">
        <button id="act-found" disabled title="Found a city here (b)">Found city</button>
        <button id="act-raid" disabled title="Plunder the neighbouring village (p). R flies the camera, so this is not on r">Raid</button>
        <button id="act-fortify" disabled title="Fortify (h). W A S D fly the camera, so this is not on f">Fortify</button>
        <button id="act-skip" disabled title="Skip this unit (x). W A S D fly the camera, so this is not on s">Skip</button>
        <button id="act-council" disabled title="Hold a council review (c)">Council</button>
      </div>
    </div>

    <div class="panel" id="research">
      <h2 id="res-title">Researching nothing</h2>
      <div class="bar"><div id="res-bar"></div></div>
      <div class="muted" id="res-status">Choose what to study.</div>
      <div class="options" id="res-options"></div>
    </div>

    <!--
      Cities and what they are building.

      A panel of its own rather than part of the selection panel: a player
      wants to see what is being built while they are moving a unit, and
      routing city orders through unit selection would have meant clicking
      away from the thing they were commanding to check.
    -->
    <div class="panel" id="cities" hidden>
      <h2 id="cities-title">Cities</h2>
      <div id="cities-list"></div>
    </div>

    <div class="panel" id="log"><div class="entry muted">Your empire begins.</div></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
